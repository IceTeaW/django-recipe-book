{% extends 'base.html' %}

{% block content %}
  <h1>Категорія: {{ category.name }}</h1>
  
  <ul>
    {% for recipe in recipes %}
      <li>
        {{ recipe.title }}
      </li>
    {% empty %}
      <li>У цій категорії рецептів не знайдено.</li>
    {% endfor %}
  </ul>

  <p><a href="{% url 'recipe:main' %}">Повернутися на головну</a></p>
{% endblock %}
